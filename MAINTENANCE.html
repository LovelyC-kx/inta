<h2 id="1-windows-powershell-%E7%BB%88%E7%AB%AF%E6%89%93%E5%8D%B0-%C2%B5-u00b5-%E6%8A%A5%E9%94%99">1. Windows PowerShell 终端打印 <code>µ</code> (U+00B5) 报错</h2>
<p><strong>现象</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>UnicodeEncodeError: 'gbk' codec can't encode character '\xb5' in position 73
</code></pre>
<p>出现在任何 <code>print(f&quot;... µV ...&quot;)</code> 上，例如 <code>tests/test_waveform_format.py</code>、<code>experiments/stream_stress_test.py</code>、<code>experiments/demo_pipeline_test.py</code>、<code>experiments/realtime_loop.py</code>。</p>
<p><strong>根因</strong><br />
Windows 中文系统 PowerShell 默认 stdout 编码是 <code>cp936/GBK</code>，无法编码 <code>µ</code>、<code>±</code> 等字符。Python 输出走 <code>sys.stdout.encoding = 'gbk'</code>。</p>
<p><strong>解决</strong><br />
跑任何含 µ 输出的脚本前，先设环境变量：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-variable">$env:PYTHONIOENCODING</span> = <span class="hljs-string">&quot;utf-8&quot;</span>
</code></pre>
<p>或单次命令前缀：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-variable">$env:PYTHONIOENCODING</span>=<span class="hljs-string">&quot;utf-8&quot;</span>; python experiments/stream_stress_test.py ...
</code></pre>
<p>（也可以在 PowerShell profile 里永久设置，或用 <code>chcp 65001</code> 把控制台切到 UTF-8。）</p>
<p><strong>涉及文件</strong>：所有打印 µ 的脚本。<strong>未改源码</strong>（这是环境问题，不是逻辑问题）。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" lang="zh-CN">
<h2 id="2-intan-rhx-tcp-%E7%8A%B6%E6%80%81%E5%BF%85%E9%A1%BB%E6%AF%8F%E6%AC%A1%E6%89%8B%E5%8A%A8-re-arm">2. Intan RHX TCP 状态必须每次手动 re-arm</h2>
<p><strong>现象</strong><br />
脚本一旦断开（正常 disconnect、异常退出、Ctrl-C），下次启动立刻 <code>ConnectionRefusedError</code>。Intan RHX 端 TCP 状态显示从 <code>Connected</code> 回到 <code>Pending</code>。</p>
<p><strong>根因</strong><br />
Intan RHX 的 TCP server 设计：每个 socket 只接受<strong>一次</strong>连接。客户端断开后，RHX 不会自动 listen — 必须在 GUI 里再点 <strong>Connect</strong> 把状态推到 <code>Pending</code>，下一个 client 才能 attach。</p>
<p><strong>解决（操作流程）</strong><br />
每跑一次脚本之前必须做：</p>
<ol>
<li>Intan RHX → <strong>Network → Remote TCP Control</strong></li>
<li><strong>Command</strong> 行点 <strong>Connect</strong>（状态：<code>Pending</code>，端口 5000）</li>
<li><strong>Waveform Output</strong> 行点 <strong>Connect</strong>（状态：<code>Pending</code>，端口 5001）</li>
<li>确认 &quot;Channels To Stream&quot; 里有 A-000 ~ A-007（或目标通道集）</li>
<li>RHX 自身的 <code>Run</code> 按钮可按可不按 — 脚本会发 <code>Set RunMode Run/Stop</code></li>
</ol>
<p>如果脚本异常 crash 中途、socket 半关闭，<strong>也得 re-arm</strong>。</p>
<p><strong>涉及文件</strong>：操作惯例，无代码变更。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" lang="zh-CN">
<h2 id="3-demo_pipeline_testpy-step-4%E6%89%80%E6%9C%89-80-%E6%9D%A1-stim-set-%E5%91%BD%E4%BB%A4-timeout">3. <code>demo_pipeline_test.py</code> Step 4：所有 80 条 stim Set 命令 timeout</h2>
<p><strong>现象</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Step 4: Configure Stimulus Parameters via TCP
  Generated 80 commands
  [FAIL] Set A-000.stimenabled true: No response for command: ...
  [FAIL] Set A-000.source KeyPressF1: No response for command: ...
  ... (×80, 每条等 2s)
  Sent: 0 OK, 80 FAIL
</code></pre>
<p>总耗时约 160 秒。</p>
<p><strong>根因</strong><br />
该 step 直接调 <code>client.send_command(cmd, timeout=2.0)</code>，<code>send_command</code> 默认 <code>expect_response=True</code>，会 <code>recv</code> 等回包。但 <code>tcp_client.py:312-316</code> 已经记录：</p>
<blockquote>
<p>VERIFIED: many Set commands do NOT echo a response.</p>
</blockquote>
<p>RHS 的 <code>Set &lt;channel&gt;.&lt;stim_param&gt;</code> 系列<strong>不会</strong> echo。所以 80 条命令实际都发到了 RHX、RHX 也执行了，只是脚本死等不存在的回包。<code>tcp_client.py:548</code> 自家的 <code>send_protocol_config()</code> 用的是 <code>expect_response=False</code> 才对。</p>
<p><strong>解决</strong><br />
<code>experiments/demo_pipeline_test.py:110-116</code> 改为：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">for</span> cmd, desc <span class="hljs-keyword">in</span> commands:
    <span class="hljs-keyword">try</span>:
        client.send_command(cmd, expect_response=<span class="hljs-literal">False</span>)   <span class="hljs-comment"># ← 关键</span>
        success_count += <span class="hljs-number">1</span>
    <span class="hljs-keyword">except</span> Exception <span class="hljs-keyword">as</span> e:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;  [FAIL] <span class="hljs-subst">{cmd}</span>: <span class="hljs-subst">{e}</span>&quot;</span>)
        fail_count += <span class="hljs-number">1</span>
</code></pre>
<p>并配一行 comment 说明 RHX 协议事实，免得后人再踩。</p>
<p><strong>涉及文件</strong>：<code>experiments/demo_pipeline_test.py</code> (Step 4 块)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" lang="zh-CN">
<h2 id="4-demo_pipeline_testpy-step-56clientrun-%E5%90%8E-get-runmode-timeout">4. <code>demo_pipeline_test.py</code> Step 5/6：<code>client.run()</code> 后 <code>Get RunMode</code> timeout</h2>
<p><strong>现象</strong><br />
Step 4 修好后 Step 5 暴露新问题：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Step 5: Start/Stop Data Acquisition
  [FAIL] Run/Stop: No response for command: Get RunMode
Step 6: ...
TimeoutError: No response for command: Get RunMode
</code></pre>
<p>注意 Step 2 同样的 <code>Get RunMode</code> 秒回。</p>
<p><strong>根因</strong><br />
<code>client.run()</code> 默认 <code>verify=True</code>，先 <code>Set RunMode Run</code>（不等回包），紧接着 <code>Get RunMode</code> 读回包。但<strong>刚发了 80 条 stim Set 命令</strong>，RHX 命令通道处于 backlog 状态，此时立刻 Get 拿不到回应。<code>stream_stress_test.py:74</code> 早就发现这点，统一用 <code>client.run(verify=False)</code>。<code>demo_pipeline_test.py</code> 没沿用。</p>
<p><strong>解决</strong><br />
Step 5 / 6 / Step 6 末尾三处 <code>client.run()</code> / <code>client.stop()</code> 全部加 <code>verify=False</code>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">client.run(verify=<span class="hljs-literal">False</span>)
client.stop(verify=<span class="hljs-literal">False</span>)
</code></pre>
<p>基础的 <code>Get RunMode</code> 读路径在 Step 2 已经验证过，这里跳过 verify 完全合理。</p>
<p><strong>涉及文件</strong>：<code>experiments/demo_pipeline_test.py</code> (Step 5、Step 6 顶部、Step 6 末尾)</p>
<h3 id="4b-%E5%90%8C%E6%A0%B7%E7%9A%84%E9%97%AE%E9%A2%98%E6%89%A9%E6%95%A3%E5%88%B0-run_2d_experimentpy-%E5%92%8C-realtime_looppy">4b. 同样的问题扩散到 <code>run_2d_experiment.py</code> 和 <code>realtime_loop.py</code></h3>
<p>后来跑 baseline phase 时 <code>client.record()</code> 又重演了同样的 timeout——<code>client.record()</code> / <code>run()</code> / <code>stop()</code> 三个方法的默认值是 <code>verify=True</code>，但项目里<strong>所有实际工作的 caller 都用 <code>verify=False</code></strong>（stress test、demo pipeline 都是手动改的）。</p>
<p><strong>根因</strong>：<code>client.set_filename()</code> 内部连发 2 个 Set（path + basefilename），紧接着 <code>client.record()</code> 立刻 Get RunMode——RHX 的命令通道还在 backlog 中。</p>
<p><strong>根本治疗</strong>：直接把 <code>tcp_client.py</code> 里 <code>run</code> / <code>stop</code> / <code>record</code> 三个方法的默认改成 <code>verify=False</code>，让 API 默认值匹配实际使用惯例。Docstring 解释了原因。</p>
<p>涉及修改：<code>intan_interface/tcp_client.py</code>（3 个 def 默认值 + docstring）。</p>
<p>之后 <code>run_2d_experiment.py</code>、<code>realtime_loop.py</code> 等不需要改任何调用代码——它们用了默认值，现在默认值变成了正确的。</p>
<p>历史 caller（stress test、demo pipeline）显式传 <code>verify=False</code>，不受影响。</p>
<h3 id="4c-tcp-set-runmode-stop-%E2%86%92-record-%E7%AB%9E%E6%80%81%E5%BF%85%E9%A1%BB-3-%E7%A7%92-settle">4c. TCP <code>Set RunMode Stop → Record</code> 竞态：必须 3 秒 settle</h3>
<p><strong>现象</strong>：跑 classify dry-run 时观察到 RHX 行为：</p>
<ul>
<li>pre-spontaneous Record → 写文件 <code>test_&lt;ts1&gt;/</code> ✓</li>
<li>pre-spontaneous Stop ← 文件确实在 2 分钟整停止增长 ✓</li>
<li>紧接着主 classify Record → <strong>无声丢弃，没有新目录</strong></li>
<li>主 loop 跑了 90s 但 RHX 没在录</li>
<li>主 Stop → no-op（RHX 早就在 Stop 状态）</li>
<li>post-spontaneous Record → 写新文件 <code>test_&lt;ts2&gt;/</code> ✓（因为已经隔了 90s）</li>
<li>post-spontaneous Stop → 文件 2 分钟整停止 ✓</li>
</ul>
<p><strong>根因</strong>：RHX 一次真录音 Stop 之后，<strong>立刻</strong>（&lt; 1 秒）发的 Record 会被丢弃。Stop 似乎需要几秒去 finalize 文件、释放内部资源，期间 Record 是 no-op。</p>
<p>不丢弃的情况：</p>
<ul>
<li>第一个 Record（RHX 从 idle Stop 起步）—— 一直工作</li>
<li>Stop 之后等几秒再 Record —— 工作</li>
</ul>
<p><strong>解决</strong>：每次 <code>client.stop()</code> 后面如果还要 <code>client.record()</code>，<strong>强制等 3 秒</strong> settle：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">client.stop()
<span class="hljs-comment"># ... 处理刚结束的录音 ...</span>
time.sleep(<span class="hljs-number">3.0</span>)  <span class="hljs-comment"># 关键：等 RHX 完全释放上一次录音</span>
client.record()
</code></pre>
<p>涉及修改：<code>experiments/run_2d_experiment.py</code> 的 <code>run_classify</code> 两处。</p>
<h3 id="4d-rhx-%E5%9C%A8-stop-%E4%B9%8B%E5%90%8E%E4%B8%8D%E5%93%8D%E5%BA%94-set-filenamepath%E5%BF%85%E9%A1%BB%E6%89%8B%E5%8A%A8-stop-%E6%89%8D%E8%83%BD%E5%BC%80%E6%96%B0%E4%BC%9A%E8%AF%9D">4d. RHX 在 Stop 之后<strong>不</strong>响应 <code>Set Filename.Path</code>，必须手动 Stop 才能开新会话</h3>
<p>诊断结果（用 <code>Get Filename.Path</code> 回读验证）：</p>
<ul>
<li>RHX 内部以<strong>正斜杠</strong>形式存储 Path：<code>F:/YKX/Intan-main1/Intan-main/data</code></li>
<li>我们 Python 用 <code>str(Path.absolute())</code> 发的是反斜杠路径，RHX <strong>完全忽略</strong></li>
<li>BaseFilename 同理——RHX 用 GUI 配置的值，TCP 改不动</li>
</ul>
<p><strong>结果</strong>：RHX 总是写到 GUI 配置的目录下、用 GUI 配置的 BaseFilename + 自己生成的 <code>_YYMMDD_HHMMSS</code> 时间戳建子目录。</p>
<p><strong>应对方案</strong>（实现在 <code>run_2d_experiment.py</code>）：</p>
<ol>
<li>脚本不再调 <code>client.set_filename()</code>——RHX 反正不听</li>
<li>加 <code>get_rhx_save_root(client)</code>：脚本启动时查 <code>Filename.Path</code>，知道 RHX 实际写到哪</li>
<li>加 <code>find_new_rhx_subdir(rhx_root, before_snapshot)</code>：每次 record/stop 后做 <code>os.listdir</code> diff，找到 RHX 新建的子目录</li>
<li>加 <code>attach_metadata_to_rhx_dir(...)</code>：把我们 Python 维护的 <code>config.json</code> / <code>trial_log.json</code> / <code>protocols.json</code> <code>shutil.copy</code> 到 RHX 子目录里，让下游 <code>pretrain_snn_decoder.py</code> 一个目录读完所有东西</li>
</ol>
<p><code>log_experiment(..., data=...)</code> 字段现在指向 RHX 子目录（而不是 Python 元数据目录），方便 <code>experiment_log.jsonl</code> 直接定位真数据。</p>
<h3 id="4e-rhx-tcp-set-runmode-stop-%E5%9C%A8-record-%E4%B8%AD%E6%9C%89%E6%97%B6%E4%B8%8D%E7%94%9F%E6%95%88%E4%BB%85%E6%89%8B%E5%8A%A8-gui-%E5%8F%AF%E4%BF%9D%E9%99%A9">4e. RHX TCP <code>Set RunMode Stop</code> 在 Record 中<strong>有时</strong>不生效（仅手动 GUI 可保险）</h3>
<p>诊断脚本里观察到：</p>
<ul>
<li><code>Set Record</code>（from Stop）→ Get 返回 &quot;Record&quot; ✓</li>
<li>接下来 <code>Set Stop</code> → 后续 Get 全部 timeout，<strong>文件继续增长 11 分钟</strong>直到我们手动 GUI 点 Stop</li>
</ul>
<p>但 baseline 测试里同样的 <code>Set Stop</code> <strong>又是</strong>生效的（文件正好 20s）。</p>
<p><strong>当前理论</strong>：Stop 在某些 RHX 内部状态下（例如刚 transition 不久、命令通道 backlog 等）会被丢弃；状态干净时正常。这个我们目前还没有可靠的 trigger 条件。</p>
<p><strong>当前 workaround</strong>：</p>
<ol>
<li>每次跑脚本前用户<strong>必须在 RHX GUI 手动点 Stop</strong>（保险，确保起步状态干净）</li>
<li>脚本内部依赖 §4c 的 3s settle，让连续 record→stop→record 大概率工作</li>
</ol>
<p>未来要做：在 RHX 文档/源码里找 Stop 的真实状态机，或者用一个轮询 <code>Get RunMode</code> 验证 Stop 真生效的封装。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" lang="zh-CN">
<h2 id="5-demo_pipeline_testpy-step-8snn-%E8%BE%93%E5%85%A5%E5%BC%A0%E9%87%8F%E5%BD%A2%E7%8A%B6%E5%8F%8D%E4%BA%86">5. <code>demo_pipeline_test.py</code> Step 8：SNN 输入张量形状反了</h2>
<p><strong>现象</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>RuntimeError: mat1 and mat2 shapes cannot be multiplied (1x40 and 8x3)
</code></pre>
<p>在 <code>decoders/snn_decoder.py:151</code> 的 <code>self.fc(spike_input[:, t, :])</code> 处。</p>
<p><strong>根因</strong><br />
原代码：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">spike_input = torch.from_numpy(
    (np.<span class="hljs-built_in">abs</span>(data_uv[:, :n_timesteps * <span class="hljs-number">75</span>]) &gt; <span class="hljs-number">50</span>)
    .astype(np.float32)
    .reshape(n_input, n_timesteps, <span class="hljs-number">75</span>)
    .mean(axis=<span class="hljs-number">2</span>)
).unsqueeze(<span class="hljs-number">0</span>)  <span class="hljs-comment"># 注释写的 (1, n_timesteps, n_input)</span>
</code></pre>
<p>但 reshape <code>(n_input=8, n_timesteps=40, 75)</code> → mean(axis=2) → <code>(8, 40)</code> → unsqueeze → <code>(1, 8, 40)</code>。<br />
<strong>实际是 <code>(1, n_input, n_timesteps)</code>，与 <code>SNNDecoder.forward</code> 契约 <code>(batch, n_timesteps, n_input)</code> 正好相反</strong>。注释和代码不一致，缺一个转置。</p>
<p><strong>解决</strong><br />
显式分离两步、转置后再 unsqueeze，并改 comment 与契约对齐：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">binned = (
    (np.<span class="hljs-built_in">abs</span>(data_uv[:, :n_timesteps * <span class="hljs-number">75</span>]) &gt; <span class="hljs-number">50</span>)
    .astype(np.float32)
    .reshape(n_input, n_timesteps, <span class="hljs-number">75</span>)
    .mean(axis=<span class="hljs-number">2</span>)
)  <span class="hljs-comment"># (n_input, n_timesteps)</span>
spike_input = torch.from_numpy(binned.T).unsqueeze(<span class="hljs-number">0</span>)  <span class="hljs-comment"># (1, n_timesteps, n_input)</span>
</code></pre>
<p><strong>涉及文件</strong>：<code>experiments/demo_pipeline_test.py</code> (Step 8)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" lang="zh-CN">
<h2 id="6-%E6%95%B0%E6%8D%AE%E4%BA%A7%E7%89%A9%E8%90%BD%E7%9B%98%E4%BD%8D%E7%BD%AE">6. 数据产物落盘位置</h2>
<p>stress test 和波形诊断会写入 <code>data/</code> 子目录（不入 git，见 <code>.gitignore</code> 的 <code>*.dat / *.rhs</code>）：</p>
<ul>
<li><code>data/stream_stress_&lt;n&gt;ch_&lt;sec&gt;s_&lt;timestamp&gt;.npz</code> — stress test 报告（含全部 timestamps、per-ch 均值方差、batch 耗时）</li>
<li><code>data/waveform_raw_diagnostic.bin</code> — <code>diagnose_waveform_format.py</code> 抓的原始字节，给 <code>locate_block_boundary.py</code> 用</li>
<li><code>data/realtime_&lt;timestamp&gt;/realtime_results.json</code> — 实时闭环每 trial 结果</li>
<li><code>data/&lt;phase&gt;_&lt;timestamp&gt;/</code> — <code>run_2d_experiment.py</code> 三阶段输出（baseline / probe / classify）</li>
</ul>
<p>如果磁盘空间紧张，stress test 的 <code>.npz</code> 可以放心删；它纯属诊断快照。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" lang="zh-CN">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-comment"># 0. 环境变量（每个新 shell 都要设一次，除非进了 profile）</span>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" lang="zh-CN">
<h2 id="8-%E7%A1%AC%E4%BB%B6%E6%8B%93%E6%89%91128-%E9%80%9A%E9%81%93--4-%C3%97-32-ch-headstage">8. 硬件拓扑：128 通道 = 4 × 32 ch headstage</h2>
<p>Intan RHS Stim/Recording Controller 一台机最多 128 通道，物理上 = <strong>4 个 32 通道 headstage</strong>（端口 A / B / C / D），每个端口接一个 headstage。</p>
<table>
<thead>
<tr>
<th>端口</th>
<th>通道命名</th>
<th>用途</th>
</tr>
</thead>
<tbody>
<tr>
<td>A</td>
<td><code>A-000</code> ~ <code>A-031</code></td>
<td>默认 stim 走 A-000~A-007（与 <code>protocol_to_commands(channel_prefix=&quot;A&quot;)</code> 对应）</td>
</tr>
<tr>
<td>B</td>
<td><code>B-000</code> ~ <code>B-031</code></td>
<td>仅记录</td>
</tr>
<tr>
<td>C</td>
<td><code>C-000</code> ~ <code>C-031</code></td>
<td>仅记录</td>
</tr>
<tr>
<td>D</td>
<td><code>D-000</code> ~ <code>D-031</code></td>
<td>仅记录</td>
</tr>
</tbody>
</table>
<p><strong>对实验流程的影响</strong>：</p>
<ol>
<li>跑 128 通道 stress test <strong>必须 4 个 headstage 都物理插上</strong>，否则 Intan 会缺通道；</li>
<li>RHX 的 &quot;Channels To Stream&quot; 要把 A-000..D-031 全勾上才能拿到 128 路数据；</li>
<li>我们代码里 stim 只用 A 端口（仅 8 路），改更多 stim 通道需要 <code>protocol_to_commands</code> 支持多前缀；</li>
<li>Wang et al. 的设计也是少量 stim + 多 rec，128ch 主要是为了拿到更多 evoked response。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" lang="zh-CN">
<h2 id="9-%E5%90%8E%E7%BB%AD%E5%8F%AF%E8%83%BD%E8%B8%A9%E5%88%B0%E7%9A%84%E5%9D%91%E9%A2%84%E8%AD%A6">9. 后续可能踩到的坑（预警）</h2>
<ul>
<li><strong>128 通道 stream</strong>：<code>stream_stress_test.py</code> 在 strict 判据下要求 cross-batch gap = 0；64 通道已过（2026-05-11，PASS），128 通道未测。先把 <code>n_channels=128</code> 跑一遍 30–60 秒看 verdict（参考 §8 把 4 个 headstage 都插上）。</li>
<li><strong><code>run_2d_experiment.py</code> classify 阶段</strong>：循环里直接 <code>client.send_protocol_config(proto)</code> → 立刻发 <code>Execute ManualStimTriggerPulse Fk</code>。<code>send_protocol_config</code> 内部已对每条 Set 用 <code>expect_response=False</code>，所以 Step 3/4 的问题不会重现。但<strong>与 §4 同源</strong>：刚发完一大批 Set 之后如果某处 Get 跟着，仍可能 timeout。如发现，沿用 <code>verify=False</code> 惯例。</li>
<li><strong>真实刺激（live stim）</strong>：<code>run_with_dashboard.py --live-stim</code> 需要在终端交互式输入 <code>ENABLE_STIM</code>，<strong>所有非交互式 runner（CI、后台 nohup）都会跳过实刺激</strong>。这是有意的安全门，别绕。</li>
<li><strong>多通道触发 jitter</strong>：<code>realtime_loop.stimulate</code> 串行发 8 次 <code>Execute ManualStimTriggerPulse Fk</code>，通道间会有 ms 级偏差。实操前用示波器测一下最大 jitter，超过协议容忍度（一般 200 ms 间隔下 5 ms 内没事）就需要换 TTL 单触发。</li>
<li><strong>滤波器</strong>：现在 <code>realtime_loop.detect_spikes</code> 直接对原始 µV 阈值。真器官信号建议在 <strong>Intan 端</strong>开 band-pass (300–3000 Hz) + notch (50/60 Hz)，省 CPU；如果不想改 RHX，就在 read 完之后用 <code>scipy.signal.sosfiltfilt</code> 加一道。</li>
<li><strong>Intan 录文件格式</strong>：<code>analyze_results.py</code> 和 <code>pretrain_snn_decoder.py</code> 都读 <code>amplifier.dat</code> (int16)。RHX 设置 → File Format 必须选 <strong>&quot;One File Per Signal Type&quot;</strong>，否则你只能拿到 <code>.rhs</code> 整包文件，离线分析跑不起来。</li>
<li><strong><code>utils/</code> 不再是空目录</strong>：已有 <code>experiment_log.py</code>（§11）。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" lang="zh-CN">
<h2 id="13-%E7%BC%96%E7%A0%81%E5%99%A8%E7%94%B5%E8%8D%B7%E9%A2%84%E7%AE%97-trim-%E6%9C%BA%E5%88%B6">13. 编码器电荷预算 trim 机制</h2>
<h3 id="%E8%83%8C%E6%99%AF">背景</h3>
<p><code>SAFETY_MAX_TOTAL_CHARGE_PER_TRIAL_NC = 200 nC</code> 是 schema 层硬安全限。但三个编码器原本谁都不知道这个上限：</p>
<table>
<thead>
<tr>
<th>编码器</th>
<th>默认参数下 max 电荷</th>
<th>100 张随机图违例率</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>delayed_phase</code></td>
<td>200 nC（贴线）</td>
<td>0%（边界）</td>
</tr>
<tr>
<td><code>lif</code></td>
<td>~150 nC</td>
<td>0%（有余量）</td>
</tr>
<tr>
<td><code>rate</code></td>
<td>~400+ nC</td>
<td><strong>100%（全爆）</strong></td>
</tr>
</tbody>
</table>
<p><code>rate</code> 直接不可用，<code>delayed_phase</code> 不可预测会随机崩。</p>
<h3 id="%E8%A7%A3%E5%86%B3%E6%96%B9%E6%A1%88">解决方案</h3>
<p>在 <code>encoders/stimulus_schema.py</code> 加 <strong><code>trim_to_charge_budget(protocol, target_charge_nc)</code></strong>：</p>
<ul>
<li>按 <code>(time_ms, channel)</code> 排序，从早到晚累加每个脉冲的双相电荷</li>
<li>累加超过 <code>target_charge_nc</code> 就停，丢掉之后的脉冲</li>
<li>删 pulse 不会破坏 min inter-pulse interval（只可能让间隔变大）</li>
<li>返回新建的、<code>validate()</code> 已通过的 StimulusProtocol</li>
</ul>
<p>默认 <code>DEFAULT_TRIM_TARGET_NC = SAFETY_MAX_TOTAL_CHARGE_PER_TRIAL_NC × 0.9 = 180 nC</code>（10% headroom）。</p>
<h3 id="encodingpipeline-%E8%87%AA%E5%8A%A8%E5%BA%94%E7%94%A8">EncodingPipeline 自动应用</h3>
<p><code>EncodingPipeline.encode_to_protocol()</code> 内部在编码器输出后<strong>始终</strong>调用 <code>trim_to_charge_budget</code>，并在<strong>第一次</strong>真正裁剪时打印一行通知：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[EncodingPipeline] trimmed 19 pulse(s) (37-&gt;18) to fit 180 nC budget (rate). Further trims will be silent.
</code></pre>
<p>之后同实例的裁剪静默。这样：</p>
<ul>
<li>用户能知道自己的编码器在被裁剪、裁了多少</li>
<li>不会被刷屏</li>
</ul>
<p>可关：构造 <code>EncodingPipeline(trim_target_nc=None)</code> 跳过裁剪（仅研究用——结果可能 fail <code>validate_safety</code>）。</p>
<h3 id="%E9%AA%8C%E8%AF%81%E7%BB%93%E6%9E%9C">验证结果</h3>
<p>100 张随机图 × 3 编码器 = <strong>300 个协议，0 违例</strong>：</p>
<table>
<thead>
<tr>
<th>编码器</th>
<th>avg pulses</th>
<th>avg charge</th>
<th>max charge</th>
<th>违例</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>delayed_phase</code></td>
<td>17.4</td>
<td>173.5 nC</td>
<td>180.0 nC</td>
<td>0/100</td>
</tr>
<tr>
<td><code>lif</code></td>
<td>10.9</td>
<td>109.0 nC</td>
<td>180.0 nC</td>
<td>0/100</td>
</tr>
<tr>
<td><code>rate</code></td>
<td>18.0</td>
<td>180.0 nC</td>
<td>180.0 nC</td>
<td>0/100</td>
</tr>
</tbody>
</table>
<p>全 6 个测试套件回归通过（test_stimulus_safety / test_waveform_format / test_feature_extraction / test_integration / test_encoders / test_decoders）。</p>
<h3 id="%E6%97%A9%E6%9C%9F%E8%A3%81%E5%89%AA--%E4%BF%9D%E7%95%99%E6%9C%80%E5%BC%BA%E7%89%B9%E5%BE%81">早期裁剪 = 保留最强特征</h3>
<p>按时间早→晚的顺序保留脉冲，对每个编码器的语义：</p>
<ul>
<li><code>delayed_phase</code>：arctan firing time 公式下，<strong>早 = 高激活</strong>。保留早期脉冲 = 保留最强特征 ✓</li>
<li><code>lif</code>：膜电位积分驱动，spike 时间近均匀分布。早期 vs 晚期信息量相当</li>
<li><code>rate</code>：Poisson 过程，时间均匀。早期一段就够代表信号</li>
</ul>
<p>不是最优策略（最优需要按&quot;每脉冲信息量&quot;打分），但比硬限丢任意脉冲好，也比强制改编码器参数好。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" lang="zh-CN">
<h2 id="10-snn-decoder-%E9%A2%84%E8%AE%AD%E7%BB%83-%E2%86%92-%E5%AE%9E%E6%97%B6-loop-%E5%8A%A0%E8%BD%BD">10. SNN decoder 预训练 → 实时 loop 加载</h2>
<p>实时 loop 默认 <code>SNNDecoder</code> 随机权重 → 预测无意义。完整闭环工作流：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-comment"># 1) 收数据（Intan RHX 端先设 &quot;One File Per Signal Type&quot;）</span>
python experiments/run_2d_experiment.py <span class="hljs-literal">--phase</span> classify <span class="hljs-literal">--encoding</span> delayed_phase
<span class="hljs-comment"># -&gt; data/classify_&lt;ts&gt;/{amplifier.dat, trial_log.json, config.json, ...}</span>

<span class="hljs-comment"># 2) 预训练 SNN</span>
python experiments/pretrain_snn_decoder.py `
    <span class="hljs-literal">--data-dir</span> <span class="hljs-keyword">data</span>/classify_&lt;ts&gt;/ `
    <span class="hljs-literal">--out-checkpoint</span> checkpoints/snn_&lt;ts&gt;.pt
<span class="hljs-comment"># -&gt; 输出 train/val acc，存 checkpoint</span>

<span class="hljs-comment"># 3) 用 checkpoint 闭环</span>
python run_with_dashboard.py `
    <span class="hljs-literal">--mode</span> closedloop `
    <span class="hljs-literal">--snn-checkpoint</span> checkpoints/snn_&lt;ts&gt;.pt `
    <span class="hljs-literal">--n-trials</span> <span class="hljs-number">50</span>
</code></pre>
<p><code>--snn-checkpoint</code> 没给时仍可跑（保留对照实验能力），但启动时会打印 <code>[WARN] No --snn-checkpoint given. SNN has random weights; predictions are meaningless until trained.</code>。</p>
<p><strong>Sanity check</strong>（不需要任何 Intan 数据）：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell">python experiments/pretrain_snn_decoder.py <span class="hljs-literal">--synthetic</span> <span class="hljs-literal">--n-epochs</span> <span class="hljs-number">10</span> `
    <span class="hljs-literal">--out-checkpoint</span> checkpoints/snn_synthetic_smoke.pt
</code></pre>
<p>跑过即说明训练循环、checkpoint I/O、SNN forward/backward 全通。</p>
<p><code>checkpoints/</code> 目录会自动建，已加入 <code>.gitignore</code>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" lang="zh-CN">
<h2 id="11-%E5%AE%9E%E9%AA%8C%E6%97%A5%E5%BF%97%E6%9C%BA%E5%88%B6%E6%AF%8F%E6%AC%A1%E5%AE%9E%E9%AA%8C%E8%87%AA%E5%8A%A8%E7%95%99%E7%97%95">11. 实验日志机制（每次实验自动留痕）</h2>
<p>所有实验脚本结束时<strong>自动</strong>追加一条记录到仓库根目录的 <code>experiment_log.jsonl</code>。一条 = 一行 JSON，append-only，永不重写。</p>
<p><strong>记录字段</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;ts&quot;</span><span class="hljs-punctuation">:</span>       <span class="hljs-string">&quot;ISO 8601 本地时间&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;script&quot;</span><span class="hljs-punctuation">:</span>   <span class="hljs-string">&quot;脚本文件名&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;args&quot;</span><span class="hljs-punctuation">:</span>     <span class="hljs-punctuation">{</span> ...完整 argparse 参数... <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;verdict&quot;</span><span class="hljs-punctuation">:</span>  <span class="hljs-string">&quot;PASS / STREAM STABLE / COMPLETE / FAIL: &lt;error&gt;&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;summary&quot;</span><span class="hljs-punctuation">:</span>  <span class="hljs-punctuation">{</span> ...关键指标，每个脚本不同... <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;data&quot;</span><span class="hljs-punctuation">:</span>     <span class="hljs-string">&quot;细节数据落盘路径&quot;</span>
<span class="hljs-punctuation">}</span>
</code></pre>
<p><strong>接入脚本</strong>：</p>
<table>
<thead>
<tr>
<th>脚本</th>
<th>verdict</th>
<th>关键 summary 字段</th>
</tr>
</thead>
<tbody>

</tr>
<tr>
<td><code>run_2d_experiment.py</code> (baseline)</td>
<td>COMPLETE</td>
<td><code>phase</code> / <code>duration_s</code> / <code>n_rec_channels</code></td>
</tr>
<tr>
<td><code>run_2d_experiment.py</code> (probe)</td>
<td>COMPLETE</td>
<td><code>phase</code> / <code>n_channels_probed</code> / <code>n_pulses_total</code></td>
</tr>
<tr>
<td><code>run_2d_experiment.py</code> (classify)</td>
<td>COMPLETE</td>

</tr>
<tr>

<p><strong>查看日志</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell">python utils/experiment_log.py <span class="hljs-literal">--tail</span> <span class="hljs-number">10</span>              <span class="hljs-comment"># 最近 10 条，单行格式</span>
python utils/experiment_log.py <span class="hljs-literal">--tail</span> <span class="hljs-number">5</span> <span class="hljs-literal">--full</span>        <span class="hljs-comment"># 最近 5 条完整 JSON</span>

    data=<span class="hljs-string">&quot;data/my_run_&lt;ts&gt;/&quot;</span>,
)
</code></pre>
<p><strong>保留位置 / 备份</strong>：</p>
<ul>
<li><code>experiment_log.jsonl</code> 在仓库根，<strong>不</strong> 被 <code>.gitignore</code> 排除——它本身是元数据，定期 commit 进 git 比丢盘里好（即使现在还不是 git repo）</li>
<li>每个实验的<strong>细节数据</strong>仍在 <code>data/&lt;...&gt;/</code> 下（npz、json、log、amplifier.dat 等），日志只是个<strong>索引</strong></li>
</ul>
</section>
